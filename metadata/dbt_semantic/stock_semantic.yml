models:
  # ── mart__sector_performance ─────────────────────────────────────────────
  - name: mart__sector_performance
    semantic_model:
      enabled: true
      name: sector_performance_table

    columns:
      - name: sector_pii
        entity:
          name: sector_pii
          type: primary

      - name: sector
        dimension:
          type: categorical

      - name: observation_date
        granularity: day
        dimension:
          type: time
        config:
          meta:
            unit: day

      - name: etf_ticker
        dimension:
          type: categorical

    metrics:
      - name: average_etf_close
        type: simple
        agg: average
        expr: etf_close
        join_to_timespine: true
        agg_time_dimension: observation_date
        config:
          meta:
            unit: usd

      - name: average_etf_change_pct
        type: simple
        agg: average
        expr: etf_change_pct
        join_to_timespine: true
        agg_time_dimension: observation_date
        config:
          meta:
            unit: percentage

      - name: average_etf_ytd_pct
        type: simple
        agg: average
        expr: etf_ytd_pct
        join_to_timespine: true
        agg_time_dimension: observation_date
        config:
          meta:
            unit: percentage

      - name: average_sector_pe_ratio
        type: simple
        agg: average
        expr: pe_ratio
        join_to_timespine: true
        agg_time_dimension: observation_date
        config:
          meta:
            unit: ratio

      - name: average_sector_pb_ratio
        type: simple
        agg: average
        expr: pb_ratio
        join_to_timespine: true
        agg_time_dimension: observation_date
        config:
          meta:
            unit: ratio

      - name: average_sector_roe_pct
        type: simple
        agg: average
        expr: roe_pct
        join_to_timespine: true
        agg_time_dimension: observation_date
        config:
          meta:
            unit: percentage

      - name: average_net_margin_pct
        type: simple
        agg: average
        expr: net_margin_pct
        join_to_timespine: true
        agg_time_dimension: observation_date
        config:
          meta:
            unit: percentage

      - name: average_change_1m_pct
        type: simple
        agg: average
        expr: change_1m_pct
        join_to_timespine: true
        agg_time_dimension: observation_date
        config:
          meta:
            unit: percentage

